name: Live-holds expiry check

# Every hold in brand/live-holds.md carries a "Review by" date, and the file's
# own contract says holds are expected to expire and be REMOVED — but nothing
# watches the dates. An expired hold is the kit's most dangerous state:
# writers either keep obeying a hold that has lifted (missed proof points) or
# start ignoring holds as stale noise (embargo breach).
#
# This scheduled check parses brand/live-holds.md daily and maintains ONE
# tracking issue listing every hold past its review-by date, for the account
# team to triage per the file's rules: confirm with the client, renew the
# date, or lift and delete the hold (recording the removal in
# brand/CHANGELOG.md). The issue closes itself when no expired holds remain.
#
# Safe on kits without dated holds: only real YYYY-MM-DD dates match, so the
# template's placeholder never fires, and a missing file skips the run.
#
# A second job watches FILE freshness the same way: every core kit file
# declares a `review_cadence:` in its metadata block, and files whose
# time-based cadence has lapsed (measured from `last_reviewed:`, falling back
# to `last_updated:`) land in their own self-closing tracking issue.
# Event-driven cadences (per-sync, per-rebrand) and `exempt` are never
# date-checked. Kit lint validates the field's vocabulary; this job only
# reads it.
#
# A flagged file is classified before it is reported. A file whose BODY is
# still byte-identical to the template's has never been populated: its
# last_updated records the day the kit was scaffolded (kit lint requires a
# real date, and on an untouched file the only commit is the kit's init), so
# the clock has been measuring the kit's age rather than a review interval.
# That is a first fill, not a refresh - and "still accurate, set
# last_reviewed" is an invalid answer for it, since there is nothing there to
# be accurate. Metadata blocks are excluded from the comparison, so filling in
# a date or bumping a version never counts as content.
#
# A third job checks the approved copy samples against the kit's CURRENT
# banned-words list. The samples are the voice's calibration set, and a rule
# added after a sample was approved leaves an off-brand sample teaching the
# old behaviour until the next quarterly refresh. The date-based cadence job
# can't see that, so this job opens its own self-closing issue when a sample
# uses a banned term. Terms are read by the same contract brand-gate uses:
# each banned bullet leads with its literal term, quoted or bolded, with
# slash or "or" variants. A hit is a prompt to review, not a verdict: a
# human decides whether the sample should be retired, trimmed or kept.
#
# LINE ENDINGS: every parser here strips carriage returns first. A kit file
# committed with CRLF endings otherwise leaves a trailing \r on each value,
# the date parser rejects it, and the file used to be skipped silently.
#
# NOTE: the workflow name "Live-holds expiry check" is load-bearing — the
# ClickUp issue sync's reconcile pass chains on it by exact name via
# workflow_run (see clickup-issue-sync.yml). Renaming this workflow silently
# breaks that chain.
#
# TRIGGERS: the daily cron is the primary watch — dates lapse with no push at
# all. The push trigger exists only to close the latency gap after a fix
# merges (a samples refresh otherwise leaves its tracking issue stale-open
# until the next cron, up to ~24h). It fires on main only, so the issues
# always reflect merged state. Deliberately NOT on pull_request: both jobs
# measure the calendar, not the diff — a PR run would checkout branch state
# and mutate the tracking issues from unmerged content (and multiply the
# ClickUp reconcile passes chained on this workflow's runs).

on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'brand/**'
      - 'strategy/**'
      - 'reference/**'

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Scan brand/live-holds.md for expired review-by dates
        id: scan
        shell: bash
        run: |
          set -euo pipefail
          FILE="brand/live-holds.md"

          if [ ! -f "$FILE" ]; then
            echo "No $FILE — check skipped."
            echo "expired=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          today=$(date -u +%F)

          # Track the current "### " hold heading; on a "**Review by:**" line
          # whose first YYYY-MM-DD date is before today, emit a markdown row.
          # HTML comments are skipped so commented-out examples never fire.
          expired=$(awk -v today="$today" '
            /<!--/ { incomment=1 }
            /-->/  { incomment=0; next }
            incomment { next }
            /^### / { heading=$0; sub(/^### +/, "", heading) }
            /\*\*Review by:\*\*/ {
              if (match($0, /[0-9]{4}-[0-9]{2}-[0-9]{2}/)) {
                d = substr($0, RSTART, RLENGTH)
                if (d < today) printf "| %s | %s |\n", heading, d
              }
            }
          ' < <(tr -d '\r' < "$FILE"))

          if [ -z "$expired" ]; then
            echo "No holds past review-by."
          else
            echo "Expired holds found:"
            echo "$expired"
          fi

          {
            echo "expired<<SCAN_EOF"
            echo "$expired"
            echo "SCAN_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create, update, or close the tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EXPIRED: ${{ steps.scan.outputs.expired }}
        shell: bash
        run: |
          set -euo pipefail
          TITLE="Live holds past review-by"

          existing=$(gh issue list --state open --json number,title \
            --search "\"$TITLE\" in:title" \
            --jq ".[] | select(.title == \"$TITLE\") | .number" | head -1)

          if [ -z "${EXPIRED//[[:space:]]/}" ]; then
            if [ -n "$existing" ]; then
              gh issue close "$existing" \
                --comment "Every hold's review-by date is current again — closing automatically."
              echo "Closed issue #$existing."
            else
              echo "Nothing expired and no open issue — nothing to do."
            fi
            exit 0
          fi

          body=$(cat <<BODY
          The daily live-holds check found holds in \`brand/live-holds.md\` past their review-by date (checked $(date -u +%F), UTC).

          | Hold | Review by |
          |---|---|
          $EXPIRED

          Per the rules in \`brand/live-holds.md\`, an expired date never means the hold has lifted — for each hold above, confirm with the account team and then either:

          - **renew** the review-by date if the hold still stands,
          - **lift** it — delete the hold's block and record the removal in \`brand/CHANGELOG.md\` — if its lift condition is met.

          This issue is maintained by \`.github/workflows/holds-expiry-check.yml\`: it is updated on every run and closes itself once no hold is past review-by.
          BODY
          )

          # Expired holds are the account team's to triage, so this issue
          # carries the `clickup` label — the opt-in marker the ClickUp issue
          # sync mirrors from (see .github/workflows/clickup-issue-sync.yml).
          # Ensure the label exists, then apply it on create AND update, so
          # issues opened before the sync existed self-heal on the next run.
          gh label create clickup \
            --description "Mirror this issue to the account team's ClickUp list" \
            --color 7057ff --force >/dev/null 2>&1 || true

          if [ -n "$existing" ]; then
            gh issue edit "$existing" --body "$body" --add-label clickup >/dev/null
            echo "Updated issue #$existing."
          else
            gh issue create --title "$TITLE" --body "$body" --label clickup
          fi

  cadence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Scan kit files for lapsed review cadences
        id: scan
        shell: bash
        run: |
          set -euo pipefail

          # The template's own files are placeholder content — a cadence
          # review is meaningless there, so the template never flags itself.
          if [ "${GITHUB_REPOSITORY:-}" = "Salween-Group/brand-kit-template" ]; then
            echo "Template repository — cadence check skipped."
            echo "stale=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          NOW=$(date -u +%s)
          TEMPLATE_RAW=https://raw.githubusercontent.com/Salween-Group/brand-kit-template/main

          # A file's content with its leading metadata comment block removed,
          # so a real last_updated or a version bump never reads as content.
          body_of() {
            if grep -q '^-->' "$1"; then
              tr -d '\r' < "$1" | sed -n '/^-->/,$p' | tail -n +2
            else
              tr -d '\r' < "$1"
            fi
          }

          # 0 when the file's body is still the template's - never populated.
          # An unreachable template copy (renamed, deleted, network) counts as
          # populated, so a fetch failure can never silently reclassify real
          # staleness as a scaffold.
          is_scaffold() {
            f="$1"; rc=1
            tmp=$(mktemp)
            if curl -fsSL --max-time 20 "$TEMPLATE_RAW/$f" -o "$tmp" 2>/dev/null; then
              if [ "$(body_of "$f" | md5sum)" = "$(body_of "$tmp" | md5sum)" ]; then rc=0; fi
            else
              echo "::warning::$f - could not fetch the template copy; treating as populated."
            fi
            rm -f "$tmp"
            return $rc
          }

          # Echo the epoch for a real YYYY-MM-DD; echo nothing otherwise.
          # Round-trip guard: no silent normalisation (2026-02-30 is invalid).
          epoch_of() {
            if [ "$(date -ud "$1" +%F 2>/dev/null)" = "$1" ]; then
              date -ud "$1" +%s
            fi
            return 0
          }

          stale=""
          scaffold=""
          while IFS= read -r f; do
            meta=$(head -40 "$f" | tr -d '\r')
            cad=$(printf '%s\n' "$meta" | sed -n 's/^[[:space:]]*review_cadence:[[:space:]]*//p' | head -1 | awk '{print $1}')
            if [ -z "$cad" ]; then continue; fi

            days=""
            case "$cad" in
              quarterly) days=90 ;;
              monthly)   days=30 ;;
              annual)    days=365 ;;
              per-sync|per-rebrand|exempt) continue ;;
              *)
                if printf '%s' "$cad" | grep -qE '^[0-9]+d$'; then
                  days=${cad%d}
                else
                  # Kit lint validates the vocabulary; the watch just skips.
                  echo "::warning::$f — unknown review_cadence \"$cad\"; skipped."
                  continue
                fi ;;
            esac

            lr=$(printf '%s\n' "$meta" | sed -n 's/^[[:space:]]*last_reviewed:[[:space:]]*//p' | head -1 | awk '{print $1}')
            lu=$(printf '%s\n' "$meta" | sed -n 's/^[[:space:]]*last_updated:[[:space:]]*//p' | head -1 | awk '{print $1}')

            # The clock reads last_reviewed when present, else last_updated —
            # so a "still accurate, no changes" review resets the clock
            # honestly, without faking a content change.
            eff=""; basis=""
            if [ -n "$lr" ]; then eff=$(epoch_of "$lr"); basis="last_reviewed $lr"; fi
            if [ -z "$eff" ] && [ -n "$lu" ]; then eff=$(epoch_of "$lu"); basis="last_updated $lu"; fi
            if [ -z "$eff" ]; then
              # Kit lint fails invalid dates on PRs; say so here too, never skip silently.
              echo "::warning::$f — no readable last_reviewed or last_updated date; cadence not checked."
              continue
            fi

            age=$(( (NOW - eff) / 86400 ))
            if [ "$age" -gt "$days" ]; then
              if is_scaffold "$f"; then
                scaffold="${scaffold}| \`$f\` | $cad | $basis | never |"$'\n'
              else
                stale="${stale}| \`$f\` | $cad | $basis | $(( age - days )) |"$'\n'
              fi
            fi
          done < <(git ls-files 'brand/*.md' 'strategy/*.md' 'reference/*.md' \
            | grep -v -E '(CHANGELOG\.md|voice-guardian-pack\.md)$' || true)

          if [ -z "${stale//[[:space:]]/}" ]; then
            echo "No populated files past their review cadence."
          else
            echo "Files past review cadence:"
            echo "$stale"
          fi
          if [ -n "${scaffold//[[:space:]]/}" ]; then
            echo "Never-populated files (still the template's body):"
            echo "$scaffold"
          fi

          {
            echo "stale<<SCAN_EOF"
            echo "$stale"
            echo "SCAN_EOF"
            echo "scaffold<<SCAN_EOF"
            echo "$scaffold"
            echo "SCAN_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create, update, or close the tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          STALE: ${{ steps.scan.outputs.stale }}
          SCAFFOLD: ${{ steps.scan.outputs.scaffold }}
        shell: bash
        run: |
          set -euo pipefail
          TITLE="Kit files past review cadence"

          existing=$(gh issue list --state open --json number,title \
            --search "\"$TITLE\" in:title" \
            --jq ".[] | select(.title == \"$TITLE\") | .number" | head -1)

          if [ -z "${STALE//[[:space:]]/}" ] && [ -z "${SCAFFOLD//[[:space:]]/}" ]; then
            if [ -n "$existing" ]; then
              gh issue close "$existing" \
                --comment "Every file is populated and inside its review cadence again - closing automatically."
              echo "Closed issue #$existing."
            else
              echo "Nothing to report and no open issue - nothing to do."
            fi
            exit 0
          fi

          cadence_block=""
          if [ -n "${STALE//[[:space:]]/}" ]; then
            cadence_block=$(cat <<BLOCK
          ### Past review cadence

          | File | Cadence | Clock basis | Days overdue |
          |---|---|---|---|
          $STALE

          A lapsed cadence never means the content is wrong - it means nobody has confirmed it recently. Review each file with the account team, then either **refresh** the content, or **confirm** it is still accurate as-is and record that by setting \`last_reviewed: <today>\` in the file's metadata block.
          BLOCK
          )
          fi

          scaffold_block=""
          if [ -n "${SCAFFOLD//[[:space:]]/}" ]; then
            scaffold_block=$(cat <<BLOCK
          ### Never populated

          | File | Cadence | Clock basis | Times reviewed |
          |---|---|---|---|
          $SCAFFOLD

          These files still carry the template's body - nothing has ever been written in them. The date above is when the kit was **scaffolded**, not when anyone reviewed anything: kit lint requires a real \`last_updated\`, and on an untouched file the only commit is the kit's init, so this clock has been measuring the kit's age.

          Treat it as a **first fill, not a refresh**. Setting \`last_reviewed\` is **not** a valid answer here - it would record that placeholder text had been reviewed and found accurate, and buy another full cadence of silence. For \`reference/approved-copy-samples.md\`, a samples refresh does the first fill.
          BLOCK
          )
          fi

          body=$(cat <<BODY
          The daily freshness check found kit files needing attention (checked $(date -u +%F), UTC).
          $cadence_block
          $scaffold_block

          This issue is maintained by \`.github/workflows/holds-expiry-check.yml\` (cadence job): it is updated on every run and closes itself once every file is populated and inside its cadence.
          BODY
          )

          # Sample and file staleness is the account team's to action, so this
          # issue carries the `clickup` label — the opt-in marker the ClickUp
          # issue sync mirrors from (see clickup-issue-sync.yml).
          gh label create clickup \
            --description "Mirror this issue to the account team's ClickUp list" \
            --color 7057ff --force >/dev/null 2>&1 || true

          if [ -n "$existing" ]; then
            gh issue edit "$existing" --body "$body" --add-label clickup >/dev/null
            echo "Updated issue #$existing."
          else
            gh issue create --title "$TITLE" --body "$body" --label clickup
          fi

  samples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Scan approved samples for current banned words
        id: scan
        shell: bash
        run: |
          set -euo pipefail
          if [ "${GITHUB_REPOSITORY:-}" = "Salween-Group/brand-kit-template" ]; then
            echo "Template repository — samples check skipped."
            echo "hits=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python3 - <<'PY'
          import os, re

          VOICE = "brand/brand-voice.md"
          SAMPLES = "reference/approved-copy-samples.md"
          QUOTES = "\"'“”‘’"


          def read(path):
              with open(path, encoding="utf-8-sig") as fh:
                  return fh.read().replace("\r", "")


          def out(value):
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
                  fh.write("hits<<SCAN_EOF\n" + value + "\nSCAN_EOF\n")


          if not (os.path.exists(VOICE) and os.path.exists(SAMPLES)):
              print("No brand-voice.md or approved-copy-samples.md - check skipped.")
              out("")
              raise SystemExit


          def strip_comments(text):
              return re.sub(r"<!--.*?-->", "", text, flags=re.S)


          voice = strip_comments(read(VOICE))
          m = re.search(r"^###\s+Banned Words[^\n]*\n(.*?)(?=^#{2,3}\s)", voice + "\n## end", re.M | re.S | re.I)
          section = m.group(1) if m else ""

          # The leading term run of each TOP-LEVEL bullet: "quoted" or **bolded** terms
          # at the start, joined only by slash / or / and / commas. A bullet with no
          # marked term falls back to its bare fragment before the first dash, bracket,
          # comma or colon (some kits write "- Leverage"). Indented sub-bullets list
          # replacements, never banned terms, so they are skipped, as are the
          # template's placeholder bullets ("[e.g. ...]").
          MARKED = r'(?:\*\*[^*]+\*\*|"[^"]+"|“[^”]+”)'
          terms = set()
          for line in section.splitlines():
              b = re.match(r"^[-*]\s+(.*)", line)
              if not b or b.group(1).lstrip().startswith("[e.g"):
                  continue
              body = b.group(1)
              run = re.match(r"^(" + MARKED + r"(?:\s*(?:/|,|\bor\b|\band\b)\s*" + MARKED + r")*)", body)
              if run:
                  for lit in re.findall(r'\*\*([^*]+)\*\*|"([^"]+)"|“([^”]+)”', run.group(1)):
                      lit = next(x for x in lit if x)
                      for t in re.split(r"\s*/\s*", lit.strip()):
                          t = t.strip(" .,:;" + QUOTES)
                          if 2 < len(t) <= 40 and len(t.split()) <= 5:
                              terms.add(t)
                  continue
              frag = re.split(r"\s+[—–]\s+|\s+-\s+|\s*\(|,|:", body)[0].strip()
              if "*" not in frag and 2 < len(frag) <= 40 and len(frag.split()) <= 4:
                  for t in re.split(r"\s*/\s*", frag):
                      t = t.strip(" .;" + QUOTES)
                      if len(t) > 2:
                          terms.add(t)


          def pattern(term):
              # Literal term, flexible space/hyphen between words, simple inflections.
              words = term.split()
              last = words[-1]
              if re.fullmatch(r"[A-Za-z]+", last):
                  if last.lower().endswith("e"):
                      tail = re.escape(last[:-1]) + r"(?:e|es|ed|er|ers|ing)"
                  else:
                      tail = re.escape(last) + r"(?:s|es|ed|ing)?"
                  head = [re.escape(w) for w in words[:-1]]
                  body = r"[\s-]+".join(head + [tail])
              else:
                  body = r"[\s-]+".join(re.escape(w) for w in words)
              return re.compile(r"(?<![\w-])" + body + r"(?![\w-])", re.I)


          samples = strip_comments(read(SAMPLES))
          heading = "(top of file)"
          rows = []
          for n, line in enumerate(samples.splitlines(), 1):
              h = re.match(r"^#{2,4}\s+(.*)", line)
              if h:
                  heading = h.group(1).strip()
                  continue
              # Sample text is blockquoted by the template's convention; context lines,
              # editor's notes and the file's own guidance are not copy, so skip them.
              if not line.lstrip().startswith(">") or "Purpose:" in line or "Maintenance:" in line:
                  continue
              for t in sorted(terms):
                  for hit in pattern(t).finditer(line):
                      # A term inside quotation marks is being mentioned (an editor's
                      # note warning against it), not used.
                      before = line[hit.start() - 1:hit.start()] if hit.start() else ""
                      after = line[hit.end():hit.end() + 1]
                      if before and after and before in QUOTES and after in QUOTES:
                          continue
                      a, z = max(0, hit.start() - 50), min(len(line), hit.end() + 50)
                      ctx = line[a:z].replace("|", "\\|").strip()
                      rows.append("| %s | %d | %s | ...%s... |" % (heading.replace("|", "\\|")[:70], n, t, ctx))
          print("Banned terms loaded: %d" % len(terms))
          if rows:
              print("Samples using banned terms:")
              print("\n".join(rows))
          else:
              print("No approved sample uses a current banned term.")
          out("\n".join(rows))
          PY

      - name: Create, update, or close the tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          HITS: ${{ steps.scan.outputs.hits }}
        shell: bash
        run: |
          set -euo pipefail
          TITLE="Approved samples use banned words"

          existing=$(gh issue list --state open --json number,title \
            --search "\"$TITLE\" in:title" \
            --jq ".[] | select(.title == \"$TITLE\") | .number" | head -1)

          if [ -z "${HITS//[[:space:]]/}" ]; then
            if [ -n "$existing" ]; then
              gh issue close "$existing" \
                --comment "No approved sample uses a current banned term - closing automatically."
              echo "Closed issue #$existing."
            else
              echo "No hits and no open issue - nothing to do."
            fi
            exit 0
          fi

          body=$(cat <<BODY
          The daily samples check found approved copy samples that use a term on the kit's **current** banned-words list (checked $(date -u +%F), UTC). A sample approved before the rule existed now teaches the old behaviour to anyone calibrating against it.

          | Sample (nearest heading) | Line | Banned term | Context |
          |---|---|---|---|
          $HITS

          A hit is a prompt to review, not a verdict: the match is literal and includes simple inflections, so check each one in context. For each sample, retire it, trim the excerpt, or keep it with a note, then record the change in \`reference/approved-copy-samples.md\`. A samples refresh (\`brand-kit-samples-refresh\`) handles this as part of its run.

          This issue is maintained by \`.github/workflows/holds-expiry-check.yml\` (samples job): it is updated on every run and closes itself once no sample uses a banned term.
          BODY
          )

          # The samples are the account team's to action, so this issue is
          # mirrored to ClickUp like the other two (see clickup-issue-sync.yml).
          gh label create clickup \
            --description "Mirror this issue to the account team's ClickUp list" \
            --color 7057ff --force >/dev/null 2>&1 || true

          if [ -n "$existing" ]; then
            gh issue edit "$existing" --body "$body" --add-label clickup >/dev/null
            echo "Updated issue #$existing."
          else
            gh issue create --title "$TITLE" --body "$body" --label clickup
          fi
