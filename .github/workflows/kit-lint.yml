name: Kit lint

# The other checks guard content (retired phrases) and freshness (holds
# expiry, pack staleness). This one guards the kit's STRUCTURE — the
# referential integrity between files that silently rots as holds are added
# and deleted:
#
#   1. Hold pointers resolve. Brand files reference holds as
#      `brand/live-holds.md` → "Name", where the quoted name is a PREFIX of
#      a hold heading in that file (prefix, not exact, so a heading's status
#      suffix can change without breaking every pointer). Deleting a hold
#      without cleaning up its pointers fails the build — the sunset pass
#      must be complete.
#   2. Hold blocks are complete. Every active hold carries Scope, Lift
#      condition, Review by (a real, plausible YYYY-MM-DD — an invalid or
#      far-future date hides the hold from the expiry watch), and Source.
#   3. Metadata is real. Core kit files carry last_updated (and the brand
#      files a version) with a valid YYYY-MM-DD — never-set placeholders and
#      free-text dates fail. review_cadence must use the freshness vocabulary
#      (quarterly | monthly | annual | <N>d | per-sync | per-rebrand | exempt;
#      missing is a warning so adoption can roll out gradually), and
#      last_reviewed, when present, must be a real date — the cadence watch
#      in holds-expiry-check.yml reads both.
#   4. The evidence register uses its own vocabulary. Status must be one of
#      usable | on hold (see live-holds) | gap-to-close | retired, and every
#      on-hold row must point at live-holds.
#   5. Section references resolve. Cross-references of the form
#      `§ "Name"` must match a real section — H2-H4 heading or bold run-in
#      label, by prefix — in the file they name, or anywhere in the kit when
#      they name none. Sections are referenced by name and never by number,
#      so the names are load-bearing; unenforced, a rename that misses one
#      reference produces no error anywhere, just a pointer that silently
#      stops resolving.
#
# Scope notes: build products, history, and docs are exempt from the pointer
# checks (CHANGELOG legitimately references deleted holds and quotes section
# names as they were at the time; the voice-guardian pack is governed by its
# own freshness gates; README and docs/ document both pointer conventions with
# literal examples, and would otherwise fail the rules they explain).
# Check 5 sees only naming that is broken WITHIN a kit. A kit whose headings
# diverge from the template but whose own references match that divergence is
# internally consistent and passes here by design — cross-kit comparison is
# kit-doctor's job, not lint's.
# Missing files are skipped — file inventory is kit-doctor's job, not lint's.
# On the template itself, placeholder values (YYYY-MM-DD) downgrade to
# warnings so the scaffold stays green.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lint kit structure
        shell: bash
        run: |
          set -uo pipefail

          # NOTE: GitHub's default bash shell injects -e, so every guard in
          # this script must be a full if-statement — a bare `[ x ] && y`
          # returning 1 kills the job silently.
          TEMPLATE_MODE=0
          if [ "${GITHUB_REPOSITORY:-}" = "Salween-Group/brand-kit-template" ]; then TEMPLATE_MODE=1; fi

          FAILS=0
          fail()  { echo "::error::$1"; FAILS=$((FAILS+1)); }
          soft()  { if [ "$TEMPLATE_MODE" = 1 ]; then echo "::warning::$1 (template placeholder tolerated)"; else fail "$1"; fi; }

          HOLDS="brand/live-holds.md"
          NOW=$(date +%s)
          HORIZON=$(( NOW + 366*86400 ))

          # Validate a YYYY-MM-DD string: real calendar date, no silent
          # normalisation (2026-02-30 must not pass as March 2).
          valid_date() {
            [ "$(date -d "$1" +%F 2>/dev/null)" = "$1" ]
          }

          # ---------- 1. Hold-pointer integrity ----------

          # Quote characters inside hold names vary between pointer and
          # heading (straight vs curly, single vs double), so both sides are
          # matched with all quote characters stripped.
          dequote() {
            sed -e "s/[\"']//g" -e 's/“//g; s/”//g; s/‘//g; s/’//g'
          }

          HEADINGS_FILE=$(mktemp)
          if [ -f "$HOLDS" ]; then
            awk '
              /<!--/ { inc=1 } /-->/ { inc=0; next } inc { next }
              /^### / { sub(/^### +/, ""); print }
            ' "$HOLDS" | dequote > "$HEADINGS_FILE"
          fi

          mapfile -t SCAN < <(git ls-files '*.md' \
            | grep -v -E '^(brand/live-holds\.md|brand/CHANGELOG\.md|reference/voice-guardian-pack\.md|README\.md|docs/)' || true)

          if [ "${#SCAN[@]}" -gt 0 ]; then
            # Only the comma/and-separated run of quoted names immediately
            # after the arrow is the pointer list — quoted prose later in
            # the same sentence is not a pointer.
            while IFS= read -r hit; do
              f=${hit%%:*}; rest=${hit#*:}; ln=${rest%%:*}; line=${rest#*:}
              after=${line#*→}
              while :; do
                after=$(printf '%s' "$after" | sed -E 's/^([[:space:]*,]+|and[[:space:]]+|or[[:space:]]+)+//')
                q=$(printf '%s' "$after" | grep -oE '^("[^"]+"|“[^”]+”)' | head -1) || true
                if [ -z "$q" ]; then break; fi
                name=${q#?}; name=${name%?}   # strip surrounding quotes
                name=$(printf '%s' "$name" | dequote)
                if ! grep -q "^$(printf '%s' "$name" | sed 's/[][\.*^$/]/\\&/g')" "$HEADINGS_FILE"; then
                  fail "$f:$ln — pointer to live-holds hold \"$name\" matches no hold heading (prefix match)."
                fi
                after=${after#"$q"}
              done
            done < <(grep -Hn "live-holds\.md" "${SCAN[@]}" /dev/null 2>/dev/null | grep "→" || true)
          fi

          # ---------- 2. Hold-block completeness ----------

          if [ -f "$HOLDS" ]; then
            while IFS='|' read -r kind heading detail; do
              case "$kind" in
                MISSING) fail "$HOLDS — hold \"$heading\" is missing required field(s): $detail" ;;
                NODATE)  soft "$HOLDS — hold \"$heading\" has a Review by line with no YYYY-MM-DD date" ;;
                DATE)
                  if ! valid_date "$detail"; then
                    fail "$HOLDS — hold \"$heading\" has an invalid Review by date: $detail"
                  elif [ "$(date -d "$detail" +%s)" -gt "$HORIZON" ]; then
                    fail "$HOLDS — hold \"$heading\" has Review by $detail, more than a year out — likely a typo, and it hides the hold from the expiry watch"
                  fi ;;
              esac
            done < <(awk '
              function flush() {
                if (h == "") return
                miss = ""
                if (!("Scope" in s))          miss = miss "Scope, "
                if (!("Lift condition" in s)) miss = miss "Lift condition, "
                if (!("Review by" in s))      miss = miss "Review by, "
                if (!("Source" in s))         miss = miss "Source, "
                if (miss != "") { sub(/, $/, "", miss); printf "MISSING|%s|%s\n", h, miss }
              }
              /<!--/ { inc=1 } /-->/ { inc=0; next } inc { next }
              /^### / { flush(); h=$0; sub(/^### +/, "", h); delete s; next }
              /^## /  { flush(); h="" }
              h != "" && /\*\*Scope:\*\*/          { s["Scope"]=1 }
              h != "" && /\*\*Lift condition:\*\*/ { s["Lift condition"]=1 }
              h != "" && /\*\*Source:\*\*/         { s["Source"]=1 }
              h != "" && /\*\*Review by:\*\*/ {
                s["Review by"]=1
                if (match($0, /[0-9]{4}-[0-9]{2}-[0-9]{2}/))
                  printf "DATE|%s|%s\n", h, substr($0, RSTART, RLENGTH)
                else
                  printf "NODATE|%s|\n", h
              }
              END { flush() }
            ' "$HOLDS")
          fi

          # ---------- 3. Metadata hygiene ----------

          need_meta() { # file require_version(0|1)
            local f=$1 want_version=$2 head lu v rc lr
            [ -f "$f" ] || return 0
            head=$(head -40 "$f")
            lu=$(printf '%s\n' "$head" | sed -n 's/^[[:space:]]*last_updated:[[:space:]]*//p' | head -1 | tr -d '[:space:]')
            if [ -z "$lu" ]; then
              fail "$f — metadata block has no last_updated field"
            elif [ "$lu" = "YYYY-MM-DD" ]; then
              soft "$f — last_updated is the unset placeholder"
            elif ! valid_date "$lu"; then
              fail "$f — last_updated is not a valid YYYY-MM-DD date: $lu"
            fi
            if [ "$want_version" = 1 ]; then
              v=$(printf '%s\n' "$head" | grep -c '^[[:space:]]*version:' || true)
              if [ "$v" -eq 0 ]; then fail "$f — metadata block has no version field"; fi
            fi
            # Freshness-watch fields (see holds-expiry-check.yml, cadence job).
            # Values may carry an inline comment, so take the first word only.
            rc=$(printf '%s\n' "$head" | sed -n 's/^[[:space:]]*review_cadence:[[:space:]]*//p' | head -1 | awk '{print $1}')
            if [ -z "$rc" ]; then
              echo "::warning::$f — metadata block has no review_cadence field (the freshness watch skips this file; see README)"
            elif ! printf '%s' "$rc" | grep -qE '^(quarterly|monthly|annual|[0-9]+d|per-sync|per-rebrand|exempt)$'; then
              fail "$f — review_cadence \"$rc\" is not in the cadence vocabulary (quarterly | monthly | annual | <N>d | per-sync | per-rebrand | exempt)"
            fi
            lr=$(printf '%s\n' "$head" | sed -n 's/^[[:space:]]*last_reviewed:[[:space:]]*//p' | head -1 | awk '{print $1}')
            if [ -n "$lr" ] && [ "$lr" != "YYYY-MM-DD" ] && ! valid_date "$lr"; then
              fail "$f — last_reviewed is not a valid YYYY-MM-DD date: $lr"
            fi
          }

          need_meta brand/brand-context.md 1
          need_meta brand/brand-voice.md 1
          need_meta brand/brand-visual.md 1
          need_meta brand/live-holds.md 0
          need_meta brand/retired-language.md 0
          need_meta reference/evidence.md 0
          need_meta reference/approved-copy-samples.md 0
          need_meta strategy/positioning.md 0
          need_meta strategy/message-house.md 0

          # ---------- 4. Evidence-register status vocabulary ----------

          EV="reference/evidence.md"
          if [ -f "$EV" ]; then
            while IFS='|' read -r kind ln st row; do
              case "$kind" in
                BADSTATUS) fail "$EV:$ln — status \"$st\" is not in the register vocabulary (usable | on hold (see live-holds) | gap-to-close | retired)" ;;
                NOPOINTER) fail "$EV:$ln — on-hold row does not point at brand/live-holds.md" ;;
              esac
            done < <(awk '
              function trim(x) { gsub(/^[[:space:]]+|[[:space:]]+$/, "", x); return x }
              !/^\|/ { idx=0; next }
              {
                n = split($0, c, "|")
                if (idx == 0) {
                  for (i = 2; i <= n; i++) if (trim(c[i]) == "Status") { idx = i; break }
                  next
                }
                if ($0 ~ /^\|[-| :]+$/) next
                st = trim(c[idx])
                if (st == "") next
                if (st != "usable" && st != "on hold (see live-holds)" && st != "gap-to-close" && st != "retired")
                  printf "BADSTATUS|%d|%s|\n", NR, st
                else if (st == "on hold (see live-holds)" && $0 !~ /live-holds\.md/)
                  printf "NOPOINTER|%d|%s|\n", NR, st
              }
            ' "$EV")
          fi

          # ---------- 5. Section-name reference integrity ----------

          # Sections are referenced by NAME, never by number (numbers shift when a kit
          # inserts a client-specific section). That makes the names load-bearing, and
          # unenforced they rot silently: a rename that misses one reference produces
          # no error anywhere, just a pointer that no longer resolves.
          #
          # Scope: `§ "Name"` references. Lines containing → are skipped — that form is
          # reserved for live-holds pointers and check 1 owns it.
          #
          # Resolution: a reference may name its target file (`brand-voice.md § "…"`,
          # with or without the extension, with or without backticks). A preceding word
          # is treated as a filename ONLY if it matches a real kit file stem — ordinary
          # English precedes § constantly ("in", "see", "and", "the"), and reading those
          # as filenames invents failures. A bare `§ "Name"` resolves against any
          # section in the kit, because bare references routinely point at another file.
          #
          # Targets are H2-H4 headings (references legitimately point at sub-sections)
          # with multi-level numbering stripped (3.1, 5.3), plus bold run-in labels
          # (`**Name:**`), which some references point at instead of a true heading.
          # Matching is by PREFIX, the same contract check 1 uses for hold pointers.

          REF_HEADINGS=$(mktemp)
          REF_UNION=$(mktemp)
          REF_HITS=$(mktemp)
          REF_STEMS=$(mktemp)

          mapfile -t ALLMD < <(git ls-files '*.md' | grep -v -E '^docs/' || true)

          if [ "${#ALLMD[@]}" -gt 0 ]; then
            for f in "${ALLMD[@]}"; do
              stem=$(basename "$f" .md)
              printf '%s\t%s\n' "$stem" "$f" >> "$REF_STEMS"
              awk -v F="$f" '
                /<!--/ { inc=1 }
                /-->/  { inc=0; next }
                inc    { next }
                /^## |^### |^#### / {
                  h=$0
                  sub(/^#+[ \t]+/, "", h)
                  sub(/^[0-9]+(\.[0-9]+)*[.)]?[ \t]+/, "", h)
                  gsub(/^[ \t]+|[ \t]+$/, "", h)
                  if (h != "") printf "%s\t%s\n", F, h
                  next
                }
                /^\*\*[^*]+\*\*/ {
                  if (match($0, /^\*\*[^*]+\*\*/)) {
                    t = substr($0, 3, RLENGTH-4)
                    sub(/:$/, "", t)
                    gsub(/^[ \t]+|[ \t]+$/, "", t)
                    if (t != "") printf "%s\t%s\n", F, t
                  }
                }
              ' "$f" >> "$REF_HEADINGS"
            done
            cut -f2 "$REF_HEADINGS" | sort -u > "$REF_UNION"

            # Files that MAY CARRY references. The changelog is an append-only record
            # that legitimately quotes section names as they were at the time; the pack
            # is a build product; README and docs/ document the convention with literal
            # examples and would fail the rule they explain.
            mapfile -t REF_SCAN < <(printf '%s\n' "${ALLMD[@]}" \
              | grep -v -E '^(brand/CHANGELOG\.md|reference/voice-guardian-pack\.md|README\.md)$' || true)

            if [ "${#REF_SCAN[@]}" -gt 0 ]; then
              awk '
                index($0, "\342\206\222") > 0 { next }   # arrow form is a hold pointer; check 1 owns it
                {
                  n = split($0, seg, "\302\247")
                  for (i = 2; i <= n; i++) {
                    s = seg[i]; q = ""
                    if (match(s, /^[ \t]*"[^"]+"/)) {
                      q = substr(s, RSTART, RLENGTH); sub(/^[ \t]*"/, "", q); sub(/"$/, "", q)
                    } else if (match(s, /^[ \t]*\342\200\234[^\342]+\342\200\235/)) {
                      q = substr(s, RSTART, RLENGTH)
                      sub(/^[ \t]*\342\200\234/, "", q); sub(/\342\200\235$/, "", q)
                    }
                    if (q == "") continue

                    # A file reference counts only when it sits IMMEDIATELY before the section
                    # mark, separated by whitespace alone, and looks like a filename. The
                    # candidate is VALIDATED, never scrubbed into shape: in
                    #   ... § "Brand Positioning", § "Key Differentiators" ...
                    # the token before the second mark is `Positioning",` — stripping its
                    # punctuation would turn a quoted section name into a bogus file
                    # reference and invent a failure.
                    fr = ""
                    p = seg[i-1]
                    if (p ~ /[ \t]$/) {
                      t = p
                      sub(/[ \t]+$/, "", t)
                      m = split(t, toks, /[ \t]/)
                      cand = (m > 0) ? toks[m] : ""
                      gsub(/^`|`$/, "", cand)
                      if (cand ~ /^[A-Za-z][A-Za-z0-9_.\/-]*$/) {
                        sub(/\.md$/, "", cand)
                        sub(/^.*\//, "", cand)
                        fr = cand
                      }
                    }
                    printf "%s\t%d\t%s\t%s\n", FILENAME, FNR, fr, q
                  }
                }
              ' "${REF_SCAN[@]}" > "$REF_HITS"

              while IFS=$'\t' read -r rf rl fr name; do
                if [ -z "$name" ]; then continue; fi
                esc=$(printf '%s' "$name" | sed 's/[][\.*^$/]/\\&/g')
                tgt=""
                if [ -n "$fr" ]; then
                  tgt=$(awk -F'\t' -v s="$fr" 'tolower($1)==tolower(s){print $2; exit}' "$REF_STEMS")
                fi
                if [ -n "$tgt" ]; then
                  if ! awk -F'\t' -v t="$tgt" '$1==t{print $2}' "$REF_HEADINGS" | grep -q "^$esc"; then
                    fail "$rf:$rl — section reference \"$name\" matches no section in $tgt (prefix match)."
                  fi
                else
                  if ! grep -q "^$esc" "$REF_UNION"; then
                    fail "$rf:$rl — section reference \"$name\" matches no section anywhere in the kit (prefix match)."
                  fi
                fi
              done < "$REF_HITS"
            fi
          fi

          rm -f "$REF_HEADINGS" "$REF_UNION" "$REF_HITS" "$REF_STEMS"

          rm -f "$HEADINGS_FILE"

          # ---------- 6. Empty retired-language table (warn only) ----------

          # An empty retired-phrases table makes the retired-language CI gate a
          # no-op, and it usually means retirement decisions are not being
          # CAPTURED — not that nothing has ever been retired. Warn-only: a kit
          # may legitimately carry none (e.g. a retired term too short to grep
          # safely, enforced as a guardrail instead — record that reasoning in
          # the file). Skipped on the template, whose table holds bracketed
          # placeholder examples by design.
          RL="brand/retired-language.md"
          if [ "$TEMPLATE_MODE" = 0 ] && [ -f "$RL" ]; then
            rl_rows=$(awk '
              /<!--/ { inc=1 } /-->/ { inc=0; next } inc { next }
              /^[[:space:]]*\|/ {
                line=$0
                if (line ~ /^[[:space:]]*\|[-| :]+\|?[[:space:]]*$/) next   # separator
                n=split(line, c, "|"); cell=c[2]
                gsub(/^[[:space:]]+|[[:space:]]+$/, "", cell)
                if (cell == "Phrase") next                                   # header
                if (cell == "") next
                rows++
              }
              END { print rows+0 }
            ' "$RL")
            if [ "$rl_rows" -eq 0 ]; then
              echo "::warning::$RL — the retired-phrases table has no rows, so the retired-language CI gate is a no-op. Usually this means retirement decisions are not being captured; if this kit deliberately carries none (e.g. enforcement moved to a guardrail), say so in the file"
            fi
          fi

          if [ "$FAILS" -gt 0 ]; then
            echo "Kit lint: $FAILS failure(s)."
            exit 1
          fi
          echo "Kit lint: clean."
