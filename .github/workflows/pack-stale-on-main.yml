name: Pack staleness on main

# Companion to pack-freshness-check.yml, which runs only on pull_request:
# a merge that changes voice sources without regenerating the pack leaves
# main silently stale, with no signal anywhere (observed live on a kit's
# brand-sync merge, 8 September 2026 — the pack regeneration stranded on the
# merged branch and nothing flagged it). This workflow runs on every push to main
# and keeps exactly one open 'pack-stale' issue as the durable signal:
#
#   * stale (a voice source changed after the pack's last update) -> ensure
#     one open pack-stale issue exists (create if missing, else leave it);
#   * fresh -> close any open pack-stale issue.
#
# Staleness is absolute, not push-range-based: the test is "did any voice
# source change since the source commit stamped in the pack's §0", so a
# missed push or force push cannot hide staleness, and the signal self-clears
# on the push that merges the regeneration PR.
#
# The stamp is read from the §0 line `**Source commit:** <repo>/tree/<full sha>`,
# whose format the generator's own §0 shape check fixes. The prose stamp line
# above it is not used: across the fleet it carries a short sha, a backticked
# sha, or wraps before the sha, so matching it silently fell back on three of
# five packs.
#
# The stamp, not the last commit that touched the pack file, is the base.
# Measuring from the pack file's last commit let a rebase hide staleness: a
# pack PR built before another source-changing PR merged, then rebased onto
# it, puts those source commits *before* its own pack commit in history, so
# the pack merged looking fresh while its §0 still described the older tree
# (observed on a kit, 8 October 2026). The last-touch commit remains the
# fallback for a pack whose §0 carries no stamp, or a stamp that is not an
# ancestor of main (e.g. a squash-merged branch-mode build).
#
# Pure signal — the run itself stays green. Regeneration judgment lives in
# the voice-guardian-pack skill (2.0.0+ is repo-first: run it from anywhere,
# by hand or from a scheduled routine that watches for pack-stale issues).
# Skipped entirely on kits that have no pack yet.

on:
  push:
    branches: [main]

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute staleness and manage the signal issue
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          PACK="reference/voice-guardian-pack.md"
          LABEL="pack-stale"

          if [ ! -f "$PACK" ]; then
            echo "No $PACK in this kit — check skipped."
            exit 0
          fi

          sources=(
            brand/brand-voice.md
            brand/brand-context.md
            brand/brand-visual.md
            brand/retired-language.md
            brand/live-holds.md
            reference/evidence.md
            reference/approved-copy-samples.md
            strategy/positioning.md
            strategy/message-house.md
          )

          stamp=$(grep -m1 -oE '^\*\*Source commit:\*\* [^ ]*/tree/[0-9a-f]{40}' "$PACK" | grep -oE '[0-9a-f]{40}$' || true)
          if [ -n "$stamp" ] && git merge-base --is-ancestor "$stamp" HEAD 2>/dev/null; then
            base="$stamp"
            base_desc="The pack's §0 stamps source commit \`${stamp:0:12}\`"
          else
            base=$(git log -1 --format=%H -- "$PACK")
            base_desc="The pack has no usable §0 source-commit stamp; it was last updated in \`${base:0:12}\`"
          fi
          echo "Staleness base: $base"
          stale_commits=$(git log --format='- %h %s' "${base}..HEAD" -- "${sources[@]}")

          open_issue=$(gh issue list --repo "$REPO" --label "$LABEL" --state open \
            --json number --jq '.[0].number // empty')

          if [ -n "$stale_commits" ]; then
            if [ -n "$open_issue" ]; then
              echo "Stale; signal issue #$open_issue already open — nothing to add."
              exit 0
            fi

            gh label create "$LABEL" --repo "$REPO" --force \
              --description "reference/voice-guardian-pack.md is stale on main" \
              --color D93F0B

            body_file=$(mktemp)
            {
              echo "${base_desc}, and these commits have touched voice sources on \`main\` since:"
              echo ""
              echo "$stale_commits"
              echo ""
              echo "**Fix:** run the **voice-guardian-pack** skill (2.0.0+ is repo-first — run it from anywhere; it clones this kit fresh, regenerates from \`origin/main\`, and opens the regeneration PR). Merging that PR closes this issue automatically on the next push to \`main\`."
              echo ""
              echo "Deployed copies follow the merged pack: a synced mirror updates on its next sync; a hand-uploaded copy stays stale until it is re-uploaded. Verify any deployed copy via the pack's §0 stamp (date + source commit)."
              echo ""
              echo "_Opened automatically by \`.github/workflows/pack-stale-on-main.yml\`._"
            } > "$body_file"

            gh issue create --repo "$REPO" \
              --title "voice-guardian-pack.md is stale on main" \
              --label "$LABEL" --body-file "$body_file"
            echo "Stale — signal issue opened."
            exit 0
          fi

          if [ -n "$open_issue" ]; then
            gh issue close "$open_issue" --repo "$REPO" --comment \
              "The pack caught up in \`$(git rev-parse --short=12 HEAD)\` — no voice-source commits after the pack's stamped source commit. Closing automatically. A synced mirror picks this up on its next sync; a hand-uploaded copy still needs re-uploading. Verify any deployed copy via the pack's §0 stamp."
            echo "Fresh — closed signal issue #$open_issue."
          else
            echo "Pack fresh — nothing to do."
          fi
